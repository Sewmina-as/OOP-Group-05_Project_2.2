# =============================================
# SocialApp - Application Configuration
# =============================================

# --- Server ---
server.port=8080

# --- PostgreSQL Database ---
# Change these credentials to match your local PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/socialapp_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables based on entity classes
# Use 'create' on first run, then switch to 'update'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- File Upload (for profile pictures) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.com.social.app=DEBUG
logging.level.org.springframework.security=INFO
