<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Login')}"></head>

<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <h1 class="brand-title">◢ Verge</h1>
            <p class="brand-subtitle">Connect with friends and the world</p>
        </div>

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

        <form th:action="@{/auth/login}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com"
                       class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Your password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <p class="auth-footer-text">
            Don't have an account?
            <a th:href="@{/auth/register}" class="link-accent">Create one</a>
        </p>

        <p class="auth-copyright">© 2026 <span class="auth-copyright-name">Achintha Sewmina Gamage</span> — All rights reserved</p>

    </div>
</div>

</body>
</html>
