<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SocialApp'">SocialApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSRF token for AJAX (if needed later) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<!-- ===================== NAVBAR ===================== -->
<nav th:fragment="navbar" class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/feed}" class="brand-link">✦ SocialApp</a>
    </div>

    <div class="navbar-search">
        <form th:action="@{/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="Search people or posts..."
                   class="search-input" th:value="${keyword}">
            <button type="submit" class="btn btn-sm btn-secondary" aria-label="Search">🔍</button>
        </form>
    </div>

    <div class="navbar-actions" sec:authorize="isAuthenticated()">
        <!-- Pending request badge -->
        <a th:href="@{/feed}" class="nav-link">
            Home
            <span th:if="${pendingRequests != null and !pendingRequests.isEmpty()}"
                  class="badge-count" th:text="${pendingRequests.size()}">0</span>
        </a>

        <a th:if="${currentUser != null}"
           th:href="@{/profile/{id}(id=${currentUser.id})}"
           class="nav-link">
            My Profile
        </a>

        <!-- Logout form (POST required by Spring Security) -->
        <form th:action="@{/auth/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline btn-sm">Logout</button>
        </form>
    </div>

    <div class="navbar-actions" sec:authorize="isAnonymous()">
        <a th:href="@{/auth/login}" class="btn btn-ghost btn-sm">Login</a>
        <a th:href="@{/auth/register}" class="btn btn-primary btn-sm">Register</a>
    </div>
</nav>

<!-- ===================== FLASH MESSAGES ===================== -->
<div th:fragment="flashMessages">
    <div th:if="${successMessage}" class="alert alert-success">
        <span>✓</span><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span>⚠</span><span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info">
        <span>ℹ</span><span th:text="${infoMessage}"></span>
    </div>
</div>

<!-- ===================== FOOTER ===================== -->
<footer th:fragment="footer" class="footer">
    <p>✦ SocialApp — Group 05, University of Kelaniya · © 2025</p>
</footer>

</html>
