<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>

<body class="page-bg">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-container">
    <div class="form-page-container">

        <div class="card">
            <h2 class="card-title">Edit Profile</h2>

            <form th:action="@{/profile/edit}" th:object="${updateProfileDTO}"
                  method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}"
                               class="form-control" required>
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}"
                              th:errors="*{firstName}"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}"
                               class="form-control" required>
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}"
                              th:errors="*{lastName}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio <span class="hint">(Optional — max 500 characters)</span></label>
                    <textarea id="bio" th:field="*{bio}" class="form-control"
                              rows="4" maxlength="500"
                              placeholder="Tell people a little about yourself..."></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('bio')}"
                          th:errors="*{bio}"></span>
                </div>

                <div class="form-actions">
                    <a th:href="@{/profile/{id}(id=${currentUser.id})}" class="btn btn-ghost">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>

    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
