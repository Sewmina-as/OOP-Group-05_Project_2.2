<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Profile')}"></head>

<body class="page-bg">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-container">
    <div class="profile-layout">

        <!-- ============ PROFILE HEADER CARD ============ -->
        <div class="card profile-header-card">

            <div class="profile-avatar-wrap">
                <div class="profile-avatar-placeholder" th:text="${profileUser.firstName.charAt(0)}">A</div>
            </div>

            <div class="profile-info">
                <h2 th:text="${profileUser.fullName}">Full Name</h2>
                <p class="profile-email" th:text="${profileUser.email}">email@example.com</p>
                <p class="profile-bio" th:text="${profileUser.bio ?: 'No bio yet.'}"
                   th:if="${profileUser.bio != null and !profileUser.bio.isEmpty()}">Bio</p>
                <p class="profile-bio" th:unless="${profileUser.bio != null and !profileUser.bio.isEmpty()}">
                    No bio yet.
                </p>
                <p class="profile-joined">
                    Joined:
                    <span th:text="${#temporals.format(profileUser.joinDate, 'MMMM d, yyyy')}">Jan 1</span>
                </p>
            </div>

            <div class="profile-actions">
                <a th:if="${isOwnProfile}" th:href="@{/profile/edit}" class="btn btn-primary">
                    Edit Profile
                </a>

                <span th:if="${!isOwnProfile and isFriend}" class="badge badge-green">✓ Friends</span>

                <span th:if="${!isOwnProfile and !isFriend and hasRequestSent}"
                      class="badge badge-grey">Request Sent</span>

                <div th:if="${!isOwnProfile and !isFriend and hasRequestReceived}"
                     class="inline-actions">
                    <span>Wants to be friends</span>
                </div>

                <form th:if="${!isOwnProfile and !isFriend and !hasRequestSent and !hasRequestReceived}"
                      th:action="@{/friends/request/{id}(id=${profileUser.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-primary">+ Add Friend</button>
                </form>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <!-- ============ STATS ROW ============ -->
        <div class="profile-stats-row">
            <div class="stat-box">
                <span class="stat-number" th:text="${posts.size()}">0</span>
                <span class="stat-label">Posts</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" th:text="${friends.size()}">0</span>
                <span class="stat-label">Friends</span>
            </div>
        </div>

        <!-- ============ POSTS BY THIS USER ============ -->
        <h3 class="section-heading">Posts</h3>

        <div th:if="${posts.isEmpty()}" class="card empty-state">
            <div class="empty-icon">📝</div>
            <p>No posts yet.</p>
        </div>

        <div th:each="post : ${posts}" class="card post-card">

            <div class="post-header">
                <div>
                    <strong th:text="${post.author.fullName}">Author</strong>
                    <span class="post-time"
                          th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy • h:mm a')}">Date</span>
                </div>
                <form th:if="${isOwnProfile}"
                      th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-icon"
                            onclick="return confirm('Delete this post?')">🗑</button>
                </form>
            </div>

            <div class="post-content" th:text="${post.content}">Content</div>

            <div class="post-stats">
                <span th:text="${post.likeCount} + ' likes'">0 likes</span>
                <span th:text="${post.comments.size()} + ' comments'">0 comments</span>
            </div>

            <div class="post-actions">
                <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post" style="display:inline; flex:1;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            th:class="${post.isLikedByUser(currentUser.id)} ? 'btn btn-liked btn-sm btn-full' : 'btn btn-outline btn-sm btn-full'">
                        <span th:text="${post.isLikedByUser(currentUser.id)} ? '❤️ Liked' : '🤍 Like'">Like</span>
                    </button>
                </form>
            </div>

            <!-- Comments -->
            <div class="comments-section" th:if="${!post.comments.isEmpty()}">
                <div th:each="comment : ${post.comments}" class="comment-item">
                    <div class="comment-avatar" th:text="${comment.author.firstName.charAt(0)}"></div>
                    <div class="comment-bubble">
                        <a th:href="@{/profile/{id}(id=${comment.author.id})}"
                           class="comment-author" th:text="${comment.author.fullName}">Author</a>
                        <p class="comment-text" th:text="${comment.content}">Comment</p>
                    </div>
                    <form th:if="${comment.author.id == currentUser.id}"
                          th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="comment-delete">×</button>
                    </form>
                </div>
            </div>

            <form th:action="@{/posts/{id}/comment(id=${post.id})}" method="post" class="comment-form-wrap comment-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="avatar-xs" th:text="${currentUser.firstName.charAt(0)}"></div>
                <input type="text" name="content" class="comment-input"
                       placeholder="Write a comment..." maxlength="500">
                <button type="submit" class="btn btn-sm btn-primary">Post</button>
            </form>
        </div>

        <!-- ============ FRIENDS LIST ============ -->
        <div class="card" th:if="${!friends.isEmpty()}">
            <h4 class="card-title">Friends</h4>
            <div class="friend-grid">
                <a th:each="friend : ${friends}"
                   th:href="@{/profile/{id}(id=${friend.id})}"
                   class="friend-grid-item">
                    <div class="friend-grid-avatar" th:text="${friend.firstName.charAt(0)}"></div>
                    <span th:text="${friend.fullName}">Name</span>
                </a>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
