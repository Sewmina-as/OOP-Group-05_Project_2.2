<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Verge'">Verge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script>
        (function () {
            const t = localStorage.getItem('verge-theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<!-- ===================== NAVBAR ===================== -->
<nav th:fragment="navbar" class="navbar">

    <!-- Brand -->
    <div class="navbar-brand">
        <a th:href="@{/feed}" class="brand-link">◢ Verge</a>
    </div>

    <!-- Center: search + nav pills (authenticated users only) -->
    <div class="navbar-center">
        <form th:action="@{/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="Search people or posts..."
                   class="search-input" th:value="${keyword}">
            <button type="submit" class="search-btn" aria-label="Search">🔍</button>
        </form>

        <!-- Nav pills — shown when logged in (currentUser is in model) -->
        <div th:if="${currentUser != null}" style="display:flex;gap:4px;margin-left:8px;">
            <a th:href="@{/feed(tab='friends')}" class="nav-pill" id="navHome">
                <span class="nav-icon">🏠</span> Home
            </a>
            <a th:href="@{/profile/{id}(id=${currentUser.id})}" class="nav-pill" id="navProfile">
                <span class="nav-icon">👤</span> Profile
            </a>
        </div>
    </div>

    <!-- Right actions — authenticated -->
    <div th:if="${currentUser != null}" class="navbar-actions">

        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span class="icon-moon">🌙</span>
            <span class="icon-sun">☀️</span>
        </button>

        <!-- Notification bell -->
        <div class="notif-wrap">
            <button type="button" class="theme-toggle notif-bell" id="notifBell" aria-label="Notifications">
                🔔
                <span th:if="${(unreadNotificationCount != null and unreadNotificationCount > 0)
                               or (pendingRequests != null and pendingRequests.size() > 0)}"
                      class="badge-count" id="notifBadge"
                      th:text="${(unreadNotificationCount != null ? unreadNotificationCount : 0)
                                + (pendingRequests != null ? pendingRequests.size() : 0)}">0</span>
            </button>

            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-dropdown-header">
                    <span>🔔 Notifications</span>
                    <form th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                          th:action="@{/notifications/read-all}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="notif-mark-all">Mark all read</button>
                    </form>
                </div>

                <!-- Notification items -->
                <div th:if="${recentNotifications != null and recentNotifications.size() > 0}"
                     class="notif-list" id="notifList">
                    <a th:each="notif : ${recentNotifications}"
                       th:href="${notif.link}"
                       th:class="${notif.read} ? 'notif-item notif-link' : 'notif-item notif-link notif-unread'"
                       th:attr="data-notif-id=${notif.id}">
                        <div class="notif-avatar" th:text="${notif.actorInitial}">A</div>
                        <div class="notif-text">
                            <strong th:text="${notif.actorName}">Someone</strong>
                            <span th:text="${notif.message}"></span>
                        </div>
                        <span class="notif-type-icon"
                              th:text="${notif.type == 'LIKE'} ? '❤️' : (${notif.type == 'COMMENT'} ? '💬' : '👥')">·</span>
                    </a>
                </div>

                <!-- Pending friend requests -->
                <div th:if="${pendingRequests != null and pendingRequests.size() > 0}"
                     class="notif-list">
                    <div class="notif-section-label">Friend Requests</div>
                    <div th:each="req : ${pendingRequests}" class="notif-item">
                        <div class="notif-avatar" th:text="${req.sender.firstName.charAt(0)}">A</div>
                        <div class="notif-text">
                            <strong th:text="${req.sender.fullName}">Sender</strong>
                            <span> wants to connect</span>
                        </div>
                        <div class="notif-actions">
                            <form th:action="@{/friends/accept/{id}(id=${req.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-primary btn-xs">Accept</button>
                            </form>
                            <form th:action="@{/friends/reject/{id}(id=${req.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-ghost btn-xs">Decline</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Empty state -->
                <div th:if="${(recentNotifications == null or recentNotifications.size() == 0)
                              and (pendingRequests == null or pendingRequests.size() == 0)}"
                     class="notif-empty">
                    <span class="notif-empty-icon">🔔</span>
                    <p>You're all caught up!</p>
                </div>
            </div>
        </div>

        <!-- Logout -->
        <form th:action="@{/auth/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>

    <!-- Right actions — anonymous (no currentUser in model) -->
    <div th:if="${currentUser == null}" class="navbar-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span class="icon-moon">🌙</span>
            <span class="icon-sun">☀️</span>
        </button>
        <a th:href="@{/auth/login}"    class="btn btn-ghost   btn-sm">Login</a>
        <a th:href="@{/auth/register}" class="btn btn-primary btn-sm">Register</a>
    </div>
</nav>

<!-- ===================== FLASH MESSAGES ===================== -->
<div th:fragment="flashMessages">
    <div th:if="${successMessage}" class="alert alert-success">
        <span>✓</span><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span>⚠</span><span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info">
        <span>ℹ</span><span th:text="${infoMessage}"></span>
    </div>
</div>

<!-- ===================== FOOTER ===================== -->
<footer th:fragment="footer" class="footer">
    <div class="footer-inner">
        <a th:href="@{/feed}" class="footer-logo">◢ Verge</a>
        <span class="footer-sep">·</span>
        <span class="footer-copy">
            © 2026
            <span class="footer-author">Achintha Sewmina Gamage</span> — All rights reserved
        </span>
        <span class="footer-sep">·</span>
        <span class="footer-made"><span class="footer-heart">♥</span> 🇱🇰</span>
    </div>
</footer>

</html>
